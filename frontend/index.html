  <!-- Early DOM Safety Patch: Prevents Google Translate removeChild crash with React -->
  <script>

        proto.removeChild = function (child) {
          if (!child) return child;
          try {
            if (child.parentNode !== this) {
              if (child.parentNode) {
                return originalRemoveChild.call(child.parentNode, child);
              }
              return child;
            }
            return originalRemoveChild.call(this, child);
          } catch (e) {
            return child;
          }
        };

        var originalInsertBefore = proto.insertBefore;
        proto.insertBefore = function (newNode, referenceNode) {
          if (!newNode) return newNode;

              if (referenceNode.parentNode && referenceNode.parentNode.parentNode === this) {
                try { return originalInsertBefore.call(this, newNode, referenceNode.parentNode); } catch (e) {}
              }
              try { return proto.appendChild.call(this, newNode); } catch (e) { return newNode; }
            }
            return originalInsertBefore.call(this, newNode, referenceNode);
          } catch (e) {

  <div id="google_translate_element" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden;">
  </div>
  <div id="root"></div>
  <script>
    (function () {
      var savedLang = localStorage.getItem('app_lang');
      if (savedLang && savedLang !== 'en') {
        var cookieVal = '/en/' + savedLang;
        document.cookie = 'googtrans=' + cookieVal + '; path=/;';
        var domain = window.location.hostname;
        if (domain && domain !== 'localhost' && domain.indexOf('127.0.0.1') === -1) {
          document.cookie = 'googtrans=' + cookieVal + '; path=/; domain=.' + domain + ';';
        }
      } else {
        var hostname = window.location.hostname;
        var domainParts = hostname.split('.');
        var domains = ['', hostname, '.' + hostname];
        while (domainParts.length > 1) {
          domains.push('.' + domainParts.join('.'));
          domainParts.shift();
        }
        var paths = ['/', window.location.pathname, ''];
        var cookieNames = ['googtrans', 'googtrans_opt', 'googtrans_domain', '_googtrans'];
        domains.forEach(function (d) {
          paths.forEach(function (p) {
            cookieNames.forEach(function (c) {
              document.cookie = c + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=' + p + ';' + (d ? ' domain=' + d + ';' : '');
              document.cookie = c + '=/en/en; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=' + p + ';' + (d ? ' domain=' + d + ';' : '');
            });
          });
        });
      }
    })();

    function googleTranslateElementInit() {
      if (window.google && window.google.translate) {
        new window.google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr,gu,bn,ta,te,kn,ml,pa,or,as,ur',
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }
    }
  </script>
